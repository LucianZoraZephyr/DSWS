# S3 黄金集：20 个真实问题。
#
# expected_* 是「必须出现在最终 YAML 里」的最小集合；允许额外候选，但
# tests/recall/test_golden.py 会同时检查 precision / 输出规模，防止
# 「把所有表列指标都塞进去」这种作弊式全召回。
#
# expected_values 只列 ES value_index_rebuild 里真实存在的值；日期列
# month/day 没有同步到 ES，因此不会出现在 expected_values 里。
version: 1

questions:
  - id: q01
    question: "华北销售额"
    expected_tables: [dim_region, fact_order]
    expected_columns:
      - dim_region.region_id
      - dim_region.region_name
      - fact_order.order_id
      - fact_order.region_id
      - fact_order.order_amount
    expected_metrics: [GMV]
    expected_values: [华北]
    must_not: [AOV, 销量, dim_region.province, dim_region.city]

  - id: q02
