[project]
name = "shopkeeper-rebuild-backend"
version = "0.1.0"
description = "电商问数智能体 · 从零重建（教学版）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "jsonschema>=4.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
